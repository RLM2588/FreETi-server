spring.application.name=backend

server.port=8091
#spring.profiles.include=local
spring.datasource.url=jdbc:postgresql://localhost:5434/${POSTGRES_DB}
spring.config.import=optional:file:.env[.properties]
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.security.user.password=${USER_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-ms=900000
jwt.refresh-token-validity-ms=604800000
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.datasource.hikari.pool-name=${HIKARI_NAME}


spring.mail.host=${MAIL_HOST}
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.yandex.ru
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

app.verification.code.length=6
app.verification.code.expiration-minutes=15
app.email.from=${MAIL_FROM}