<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 0 0 5px 5px;
        }
        .code {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            padding: 20px;
            background-color: #e8f5e9;
            border-radius: 5px;
            margin: 20px 0;
            letter-spacing: 5px;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Подтверждение регистрации</h1>
    </div>
    <div class="content">
        <p>Здравствуйте, <strong th:text="${username}">User</strong>!</p>
        <p>Спасибо за регистрацию. Подтверждения почты регистрации используйте следующий код подтверждения:</p>

        <div class="code" th:text="${code}">123456</div>

        <p>Этот код действителен в течение 15 минут.</p>
        <p>Если вы не запрашивали этот код, просто проигнорируйте это письмо.</p>
    </div>
    <div class="footer">
        <p>С уважением,<br> команда Freeti</p>
    </div>
</div>
</body>
</html>
